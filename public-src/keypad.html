<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autopilot</title>
  <link rel="icon" type="image/png" href="favicon.ico">
  <script>
    // ?design=classic switches back to the classic remote.
    if (new URLSearchParams(window.location.search).get('design') === 'classic') {
      window.location.replace('index.html' + window.location.search);
    }
  </script>
  <script src="keypad.min.js"></script>
  <style>
    :root {
      --bg: #111417;
      --panel: #22272c;
      --panel-2: #2d3339;
      --text: #f2f4f5;
      --muted: #9aa3ab;
      --green: #2fae3c;
      --green-dark: #1f7f2a;
      --red: #d9302c;
      --port: #e5413b;
      --stbd: #35c24a;
      --key: #1a1d20;
      --alarm: #e0a100;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    button { font: inherit; }

    .ap {
      min-height: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      padding: 12px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-aspect-ratio: 1/1) and (min-width: 700px) {
      .ap { grid-template-columns: 1.1fr 1fr; height: 100%; }
    }

    /* Display */
    .display {
      background: var(--panel);
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      min-height: 360px;
    }

    .modebar { display: flex; height: 64px; background: var(--green); flex: none; }
    .modebar .letter {
      width: 72px; display: flex; align-items: center; justify-content: center;
      font-size: 36px; font-weight: 700; background: var(--green-dark);
    }
    .modebar .name {
      flex: 1; display: flex; align-items: center; padding-left: 16px;
      font-size: 22px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase;
    }
    .modebar.standby { background: var(--panel-2); }
    .modebar.standby .letter { background: var(--red); }
    .modebar.offline { background: var(--panel-2); color: var(--muted); }
    .modebar.offline .letter { background: var(--panel-2); }

    .alarm {
      display: none; align-items: center; gap: 10px; width: 100%; border: 0;
      background: var(--alarm); color: #111; font-size: 18px; font-weight: 700;
      padding: 10px 16px; text-align: left; cursor: pointer; flex: none;
    }
    .alarm.on { display: flex; }
    .alarm .dot { width: 12px; height: 12px; border-radius: 50%; background: #111; flex: none; }
    .alarm .hint { margin-left: auto; font-size: 14px; font-weight: 400; }

    .info {
      display: none; padding: 8px 16px; background: var(--panel-2); color: var(--text);
      font-size: 15px; flex: none;
    }
    .info.on { display: block; }

    .values {
      flex: 1; display: flex; flex-direction: column; justify-content: center;
      gap: 10px; padding: 12px 16px;
    }
    .val { text-align: center; }
    .val .label { color: var(--muted); font-size: 16px; }
    .val .num {
      font-size: 96px; font-weight: 700; line-height: 1; display: inline-flex;
      align-items: flex-start; gap: 8px; font-variant-numeric: tabular-nums;
    }
    .val .num .unit { font-size: 26px; font-weight: 400; margin-top: 8px; color: var(--muted); }
    .val.small .num { font-size: 60px; }
    .tri {
      width: 0; height: 0; align-self: center;
      border-top: 14px solid transparent; border-bottom: 14px solid transparent;
      border-left: 22px solid transparent;
    }
    .tri.port { border-left: 0; border-right: 22px solid var(--port); }
    .tri.stbd { border-left: 22px solid var(--stbd); }

    .rudder { display: flex; justify-content: center; padding-bottom: 10px; flex: none; }
    .rudder svg { width: 240px; height: 96px; }

    /* Mode menu */
    .menu {
      position: absolute; inset: 0; background: var(--panel); display: none;
      flex-direction: column; padding: 8px; gap: 6px; overflow-y: auto;
    }
    .menu.open { display: flex; }
    .menu .back {
      background: var(--panel-2); color: var(--text); border: 0; height: 52px; flex: none;
      font-size: 18px; text-align: left; padding-left: 16px; border-radius: 4px; cursor: pointer;
    }
    .menu .item {
      display: flex; height: 64px; flex: none; background: var(--green); border: 0;
      color: var(--text); border-radius: 4px; overflow: hidden; cursor: pointer; padding: 0;
    }
    .menu .item .letter {
      width: 72px; display: flex; align-items: center; justify-content: center;
      font-size: 32px; font-weight: 700; background: var(--green-dark);
    }
    .menu .item .name {
      flex: 1; display: flex; align-items: center; padding-left: 16px;
      font-size: 20px; font-weight: 700; text-transform: uppercase;
    }
    .menu .item.on { outline: 3px solid var(--text); outline-offset: -3px; }

    /* Keys */
    .keys {
      background: var(--panel); border-radius: 6px; padding: 14px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-content: center;
    }
    .key {
      background: var(--key); color: var(--text); border: 1px solid #000; border-radius: 40px;
      height: 72px; font-size: 28px; font-weight: 600; display: flex; align-items: center;
      justify-content: center; gap: 4px; cursor: pointer; box-shadow: inset 0 1px 0 #3a3f44;
      user-select: none; touch-action: manipulation;
    }
    .key:active { filter: brightness(1.6); }
    .key .p { color: var(--port); }
    .key .s { color: var(--stbd); }
    .key.word { font-size: 20px; letter-spacing: .5px; }
    .key.stby { background: var(--red); color: #fff; }
    .key.auto { color: var(--red); }
    .key.on { outline: 3px solid var(--green); }
    .gap { grid-column: 1 / -1; height: 4px; }
  </style>
</head>

<body>
  <div class="ap">
    <section class="display">
      <div class="modebar offline" id="modebar">
        <div class="letter" id="modeLetter"></div>
        <div class="name" id="modeName">No pilot</div>
      </div>
      <button class="alarm" id="alarm" type="button">
        <span class="dot"></span><span id="alarmText"></span><span class="hint">tap to silence</span>
      </button>
      <div class="info" id="info" role="status" aria-live="polite"></div>
      <div class="values" id="values"></div>
      <div class="rudder" id="rudder"></div>
      <div class="menu" id="menu">
        <button class="back" type="button" data-cmd="closeMenu">&lsaquo; Back</button>
        <div id="menuItems" style="display: contents"></div>
      </div>
    </section>

    <section class="keys">
      <button class="key" type="button" data-cmd="-10" aria-label="10 degrees to port"><span class="p">&lt;</span>10</button>
      <button class="key" type="button" data-cmd="+10" aria-label="10 degrees to starboard">10<span class="s">&gt;</span></button>
      <button class="key" type="button" data-cmd="-1" aria-label="1 degree to port"><span class="p">&lt;</span>1</button>
      <button class="key" type="button" data-cmd="+1" aria-label="1 degree to starboard">1<span class="s">&gt;</span></button>
      <div class="gap"></div>
      <button class="key word stby" type="button" data-cmd="standby">STBY</button>
      <button class="key word auto" type="button" data-cmd="auto" id="keyAuto">AUTO</button>
      <button class="key word" type="button" data-cmd="wind" id="keyWind">WIND</button>
      <button class="key word" type="button" data-cmd="menu">MODE</button>
    </section>
  </div>
</body>

</html>
